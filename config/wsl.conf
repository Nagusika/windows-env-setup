# Per-distro WSL settings - deployed to /etc/wsl.conf inside Ubuntu.
# Docs: https://learn.microsoft.com/windows/wsl/wsl-config

[boot]
systemd=true

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true
# Do NOT append the entire Windows PATH into WSL: it noticeably slows shell
# startup and tab-completion. Windows interop still works - call an exe by its
# full path (e.g. /mnt/c/Windows/System32/clip.exe) if you need it.
appendWindowsPath=false

[automount]
enabled=true
root=/mnt/
# 'metadata' lets you chmod/chown files on /mnt/c; sane default permissions.
options="metadata,umask=22,fmask=11"
mountFsTab=true

[filesystem]
umask=022
