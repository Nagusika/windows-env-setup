general:
  # Commands to run when the WM has started (used here to launch Zebar).
  startup_commands: ['shell-exec zebar']

  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: false

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  # How windows are hidden when switching workspaces.
  # - 'cloak': recommended (v3.6+), hides with no animation.
  # - 'hide': legacy (v3.5 and earlier), brief animation but unstable with some apps.
  hide_method: 'cloak'

  # Affects which windows show in the native Windows taskbar.
  # - 'true': show all windows regardless of workspace.
  # - 'false': only windows from the currently shown workspaces.
  show_all_in_taskbar: true

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': jump when focus changes between monitors.
    # - 'window_focus': jump when focus changes between windows.
    trigger: 'monitor_focus'

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: '5px'

  # Gap between windows and the screen edge (top leaves room for the Zebar bar).
  outer_gap:
    top: '25px'
    right: '0px'
    bottom: '0px'
    left: '0px'

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border (Windows 11 only).
    border:
      enabled: true
      color: '#98971a'

    hide_title_bar:
      enabled: false

    # Corner style (Windows 11 only): 'square', 'rounded', 'small_rounded'.
    corner_style:
      enabled: true
      style: 'small_rounded'

    transparency:
      enabled: false
      opacity: '99%'

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: false
      color: '#b19cd9'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: true
      opacity: '99%'

window_behavior:
  # New windows are created in this state whenever possible: 'tiling' | 'floating'.
  initial_state: 'tiling'

  state_defaults:
    floating:
      centered: true
      shown_on_top: true
    fullscreen:
      maximized: true
      shown_on_top: false

# Workspaces and their monitor binding.
#
# MULTI-MONITOR NOTE: this default assumes a 3-monitor setup (bind_to_monitor 0/1/2).
# On a single laptop screen, GlazeWM falls back to the primary monitor, so every
# workspace still works - it just stacks them all on one screen. To adapt:
#   - 1 monitor : set every `bind_to_monitor` to 0 (or remove the lines).
#   - 2 monitors: use 0 and 1 only.
workspaces:
  ### Monitor 0
  - name: "1"            # HOME / catch-all
    display_name: "1🏡"
    keep_alive: true
    bind_to_monitor: 0
  - name: "2"            # Mail / Teams
    display_name: "2📧"
    bind_to_monitor: 0
  - name: "3"            # Spotify / media
    display_name: "3🎵"
    bind_to_monitor: 0
  ### Monitor 1
  - name: "4"            # VS Code / Cursor
    display_name: "4🖥️"
    keep_alive: true
    bind_to_monitor: 1
  - name: "5"            # Windows Terminal
    display_name: "5📟"
    bind_to_monitor: 1
  - name: "6"            # MS Office
    display_name: "6📑"
    bind_to_monitor: 1
  ### Monitor 2
  - name: "7"            # Web browser
    display_name: "7🌍"
    keep_alive: true
    bind_to_monitor: 2
  - name: "8"            # Explorer
    display_name: "8📂"
    bind_to_monitor: 2
  - name: "9"            # Notes / misc
    display_name: "9📜"
    bind_to_monitor: 2

window_rules:
  # Windows that should never be managed (tiled) by GlazeWM.
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys.PowerAccent' }
      - window_process: { equals: 'Taskmgr' }
      - window_process: { equals: 'KeePassXC' }
      - window_process: { equals: 'Lively' }
        window_class: { regex: 'HwndWrapper*' }
      # WSLg / RDP RemoteApp and X servers.
      - window_process: { equals: 'mstsc' }
      - window_class: { equals: 'RAIL_WINDOW' }
      - window_process: { regex: 'vcxsrv|x410|xming' }

  # Auto-assign applications to workspaces.
  - commands: ['move --workspace 2']          # Mail / Teams 📧
    match:
      - window_process: { regex: 'OUTLOOK|ms-teams' }

  - commands: ['move --workspace 3']          # Spotify / media 🎵
    match:
      - window_process: { regex: '[sS]potify' }

  - commands: ['move --workspace 4']          # VS Code / Cursor 🖥️
    match:
      - window_process: { regex: 'Code|Cursor' }

  - commands: ['move --workspace 5']          # Windows Terminal 📟
    match:
      - window_process: { regex: 'WindowsTerminal|wt|cmd' }

  - commands: ['move --workspace 6']          # MS Office 📑
    match:
      - window_process: { regex: 'WORD|EXCEL|VISIO' }

  - commands: ['move --workspace 7']          # Web browser 🌍
    match:
      - window_process: { regex: 'msedge|brave|chrome|firefox' }

  - commands: ['move --workspace 8']          # Explorer 📂
    match:
      - window_process: { regex: 'explorer' }

  - commands: ['move --workspace 9']          # Notes / misc 📜
    match:
      - window_process: { regex: 'ONENOTE|ChatGPT' }

binding_modes:
  # Resize the focused window with arrow keys or HJKL (enter via alt+r).
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

  # Disable all keybindings except alt+shift+p (which returns to default).
  - name: 'pause'
    keybindings:
      - commands: ['wm-disable-binding-mode --name pause']
        bindings: ['alt+shift+p']

keybindings:
  # --- Focus: act on the cursor. ---
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # --- Shift = move the WINDOW (consistent across all four directions). ---
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # --- Shift+Ctrl = move the WORKSPACE to another monitor. ---
  # (Avoids alt+ctrl, which equals AltGr on AZERTY/international layouts.)
  - commands: ['move-workspace --direction left']
    bindings: ['alt+shift+ctrl+h', 'alt+shift+ctrl+left']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+shift+ctrl+l', 'alt+shift+ctrl+right']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+shift+ctrl+k', 'alt+shift+ctrl+up']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+shift+ctrl+j', 'alt+shift+ctrl+down']

  # --- Resize via a dedicated mode (alt+r, then HJKL / arrows). ---
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # Pause all keybindings until alt+shift+p is pressed again.
  - commands: ['wm-enable-binding-mode --name pause']
    bindings: ['alt+shift+p']

  # Change tiling direction (where the next tiling window is inserted).
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # Cycle focus: tiling -> floating -> fullscreen.
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']

  # Toggle the focused window's state.
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']

  # Close the focused window.
  - commands: ['close']
    bindings: ['alt+shift+q']

  # Exit GlazeWM (stops Zebar first).
  - commands: ['shell-exec powershell if (Get-Process -Name "zebar") { Stop-Process -Name "zebar" -Force }', 'wm-exit']
    bindings: ['alt+shift+e']

  # Reload the configuration / redraw all windows.
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Launch a terminal (Windows Terminal).
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # Workspace navigation.
  - commands: ['focus --next-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+d']

  # Focus a workspace by number.
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  # Move the focused window to a workspace (and follow it).
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
